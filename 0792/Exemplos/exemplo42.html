<!DOCTYPE html>
<html>
<head>
  <title>Exemplo de Colspan e Rowspan</title>
</head>
<body>

<h2>Horário Semanal</h2>

<table border="1">
  <tr>
    <th>Dia</th>
    <th>Manhã</th>
    <th>Tarde</th>
  </tr>

  <tr>
    <td rowspan="2">Segunda</td>
    <td>Matemática</td>
    <td>Português</td>
  </tr>

  <tr>
    <td>Física</td>
    <td>História</td>
  </tr>

  <tr>
    <td>Terça</td>
    <td colspan="2">Trabalho de Grupo</td>
  </tr>
</table>

</body>
</html>
