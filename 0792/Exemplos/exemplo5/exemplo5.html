<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Multimédia e GIF</title>
    </head>

    <body>
        <h1>Inserir multimédia</h1>

        <h3>Inserir audio</h3>
        <audio controls>
            <source src="Murcielago.mp3" type="audio/mpeg">
        </audio>

        <h3>Inserir video</h3>
        <video width="300" controls>
            <source src="LFA.mp4" type="video/mp4">
        </video>

        <h3>Inserir GIF</h3>
        <img src="r34.gif" alt="Gif animado" width="200">
    </body>
</html>
